name: Update Homebrew Tap

on:
  release:
    types: [published]

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Get release info
        id: release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256
        id: sha
        run: |
          SHA=$(curl -sL "https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.release.outputs.tag }}.tar.gz" | sha256sum | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update formula in tap
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          script: |
            const owner = 'zackwag';
            const repo = 'homebrew-tap';
            const path = 'Formula/brew-export.rb';

            const { data: file } = await github.rest.repos.getContent({ owner, repo, path });
            let content = Buffer.from(file.content, 'base64').toString('utf8');

            content = content.replace(/version ".*"/, `version "${{ steps.release.outputs.version }}"`);
            content = content.replace(/sha256 ".*"/, `sha256 "${{ steps.sha.outputs.sha256 }}"`);

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: `Update brew-export to ${{ steps.release.outputs.tag }}`,
              content: Buffer.from(content).toString('base64'),
              sha: file.sha,
            });
